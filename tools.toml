# Tools exposed to agents through this marketplace, grouped into plugins.
#
# Each tool's own repository is the source of truth for its skills. `make sync-tools`
# copies them into plugins/<plugin>/skills/ at the pinned release `ref`, generates the
# plugin's .mcp.json (launched through bx at that same ref, so skills and binary agree),
# and records every synced file in tools.lock.json. `make lint` fails when this manifest
# and the lock disagree, or when a synced file has been edited here.
#
# Grouping rules (see README.md "How tools are grouped"):
#   one plugin per job myspec switches on or off per lifecycle mode; tools relevant only
#   to some repos get their own plugin; tools sharing an artefact share a plugin.
#
#   repo   — grahambrooks/<repo>
#   ref    — release tag; must have binaries bx can resolve if `mcp` is set
#   skills — directory whose subdirectories each hold a SKILL.md
#   skill  — a single skill directory (named after its frontmatter `name`)
#   mcp    — server name and the args passed to the binary

[[plugin]]
name = "architecture"

  [[plugin.tool]]
  repo = "forge"
  ref = "v2026.9.8"
  skills = "integrations/claude-plugin/forge-architect/skills"
  mcp = { server = "forge", args = ["mcp"] }

  # No MCP yet: tropism-mcp ships in the release but is a stub ("not implemented
  # yet", build-order step 6). The skills drive the `tropism` CLI.
  [[plugin.tool]]
  repo = "tropism"
  ref = "v2026.9.3"
  skills = "skills"

[[plugin]]
name = "api-contracts"

  [[plugin.tool]]
  repo = "brake"
  ref = "v2026.9.3"
  skills = ".claude/skills"
  mcp = { server = "brake", args = ["mcp"] }

[[plugin]]
name = "docs-and-diagrams"

  [[plugin.tool]]
  repo = "adoc"
  ref = "v2026.9.10"
  skill = "docs/genai/claude-skill"

[[plugin]]
name = "refactoring"

  # The skill drives the colab CLI. colab's MCP server is left out until it speaks
  # MCP's newline-delimited stdio framing; it currently uses LSP-style
  # Content-Length headers, which Claude Code cannot read. colab-extend (in the
  # same directory) is for developing colab itself, so only colab-codemod is synced.
  [[plugin.tool]]
  repo = "colab"
  ref = "v2026.9.2"
  skill = ".claude/skills/colab-codemod"
