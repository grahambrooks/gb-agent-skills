# Tools exposed to agents through this marketplace, grouped into plugins.
#
# Each tool's own repository is the source of truth for its skills. `make sync-tools`
# copies them into plugins/<plugin>/skills/ at the pinned release `ref`, generates the
# plugin's .mcp.json (launched through bx at that same ref, so skills and binary agree),
# and records every synced file in tools.lock.json. `make lint` fails when this manifest
# and the lock disagree, or when a synced file has been edited here.
#
# Grouping rules (see README.md "How tools are grouped"):
#   one plugin per job myspec switches on or off per lifecycle mode; tools relevant only
#   to some repos get their own plugin; tools sharing an artefact share a plugin.
#
#   repo   — grahambrooks/<repo>
#   ref    — release tag; must have binaries bx can resolve if `mcp` is set
#   skills — directory whose subdirectories each hold a SKILL.md
#   skill  — a single skill directory (named after its frontmatter `name`)
#   mcp    — server name and the args passed to the binary
#
# Plugin-level: `bx_hook = false` skips the generated bx-check SessionStart hook,
# for a plugin that ships its own (see sync_tool_skills.py).

[[plugin]]
name = "code-intelligence"
# The explore-code skill and the SessionStart hook (bx check + background first
# index) are authored here, not synced, so the generated bx hook is skipped.
# hooks/session-start.sh reads the pinned symgraph spec from the generated
# .mcp.json, so the index it builds comes from the same release as the server.
bx_hook = false

  [[plugin.tool]]
  repo = "symgraph"
  ref = "v2026.11.1"
  mcp = { server = "symgraph", args = ["serve"] }

[[plugin]]
name = "architecture"

  [[plugin.tool]]
  repo = "forge"
  ref = "v2026.9.8"
  skills = "integrations/claude-plugin/forge-architect/skills"
  mcp = { server = "forge", args = ["mcp"] }

  # tropism-mcp needs v2026.11.2 or later: earlier releases shipped it as a stub.
  # It takes no args; the scan root defaults to the working directory. The skills
  # still drive the `tropism` CLI, which the MCP tools mirror (tropism#51).
  [[plugin.tool]]
  repo = "tropism"
  ref = "v2026.11.2"
  skills = "skills"
  mcp = { server = "tropism", bin = "tropism-mcp" }

[[plugin]]
name = "api-contracts"

  [[plugin.tool]]
  repo = "brake"
  ref = "v2026.9.3"
  skills = ".claude/skills"
  mcp = { server = "brake", args = ["mcp"] }

[[plugin]]
name = "docs-and-diagrams"

  [[plugin.tool]]
  repo = "adoc"
  ref = "v2026.9.10"
  skill = "docs/genai/claude-skill"

[[plugin]]
name = "refactoring"

  # colab's MCP server needs v2026.11.2 or later: earlier releases framed stdio
  # with LSP-style Content-Length headers, which MCP clients cannot read (colab#46).
  # colab-extend (in the same directory) is for developing colab itself, so only
  # colab-codemod is synced.
  [[plugin.tool]]
  repo = "colab"
  ref = "v2026.11.2"
  skill = "plugins/claude/colab/skills/colab-codemod"
  mcp = { server = "colab", args = ["mcp"] }

  # Skill only: refactor-dsl ships no MCP server. The skill drives the `refactor`
  # CLI (tree-sitter `find`, regex `replace`) and says when to use colab instead.
  [[plugin.tool]]
  repo = "refactor-dsl"
  ref = "v2026.11.2"
  skill = "skills/refactor-dsl"
